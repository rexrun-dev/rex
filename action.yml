name: 'rex - Universal Project Runner'
description: 'Zero-config CI step that detects your stack and runs the right command. Replace 10 lines of YAML with one step.'
author: 'rexrun-dev'
branding:
  icon: 'terminal'
  color: 'orange'

inputs:
  command:
    description: 'The rex command to run (test, build, run, deps, clean, fresh, fmt, lint)'
    required: true
    default: 'test'
  version:
    description: 'Version of rex to install (e.g. v0.4.0). Default: latest.'
    required: false
    default: 'latest'
  args:
    description: 'Extra arguments to pass after the command'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install rex
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sL https://api.github.com/repos/rexrun-dev/rex/releases/latest | grep tag_name | cut -d'"' -f4)
        fi
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        URL="https://github.com/rexrun-dev/rex/releases/download/${VERSION}/rex_${VERSION#v}_${OS}_${ARCH}.tar.gz"
        curl -sL "$URL" | tar xz -C /usr/local/bin rex
        echo "rex ${VERSION} installed"
    - name: Run rex ${{ inputs.command }}
      shell: bash
      run: |
        rex ${{ inputs.command }} ${{ inputs.args }}
