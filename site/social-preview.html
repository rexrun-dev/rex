<!DOCTYPE html>
<html>
<head>
    <style>
        /* This page is meant to be screenshotted at 1280x640 for social preview */
        body {
            margin: 0;
            width: 1280px;
            height: 640px;
            background: #0a0a0b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: #e4e4e7;
        }
        .logo { width: 360px; margin-bottom: 24px; }
        .tagline { font-size: 28px; color: #71717a; font-weight: 300; margin-bottom: 40px; }
        .command {
            background: #141416;
            border: 1px solid #2a2a2e;
            border-radius: 12px;
            padding: 16px 32px;
            font-family: 'SF Mono', monospace;
            font-size: 22px;
        }
        .command .arrow { color: #f97316; }
        .command .dim { color: #71717a; }
    </style>
</head>
<body>
    <img src="logo.png" class="logo" alt="rex">
    <p class="tagline">run anything, know nothing.</p>
    <div class="command">
        <span class="arrow">$</span> rex test <span class="arrow">→</span> <span class="dim">go test ./...</span>
    </div>
</body>
</html>
